name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 1.25 is the go.mod floor; 1.27 is the newest release. Testing both
        # keeps the low floor honest and catches new-toolchain regressions.
        go: ['1.25', '1.27']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...
      - run: go test ./...

      - name: Test with the race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
      - name: Build every release target
        run: ./scripts/build-release.sh
