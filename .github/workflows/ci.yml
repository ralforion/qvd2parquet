name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 1.25 is the go.mod floor; 1.27 is the newest release. Testing both
        # keeps the low floor honest and catches new-toolchain regressions.
        go: ['1.25', '1.27']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...
      - run: go test ./...

      - name: Test with the race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

  # The notices file is generated from the module graph, so a dependency bump
  # that forgets to regenerate it would ship an archive whose licence texts do
  # not match the code inside the binary.
  notices:
    name: notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Verify THIRD-PARTY-NOTICES.md is current
        run: ./scripts/gen-notices.sh --check

  # One job per release target, so the 16 builds run in parallel instead of
  # taking ~21 minutes end to end. Each target compiles its own copy of the
  # Arrow dependency tree, which is what makes the sequential form slow.
  # No build cache here on purpose. The Go build cache is keyed by the source,
  # so it would miss on every commit while still paying 16 parallel ~210 MB
  # saves per run -- which pushed the repository past its 10 GB cache limit and
  # left "Post Cache" steps hanging until they were cancelled, failing the job
  # after the build itself had succeeded in seconds. setup-go still caches
  # modules, which is the part that actually repeats.
  build:
    name: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - darwin/amd64
          - darwin/arm64
          - linux/amd64
          - linux/arm64
          - windows/amd64
          - windows/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Build ${{ matrix.target }}
        env:
          PLATFORMS: ${{ matrix.target }}
          VERSION: ci
        run: ./scripts/build-release.sh

  # A single gate so branch protection has one stable check to require, rather
  # than sixteen that change whenever the target list does.
  cross-compile:
    name: cross-compile
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every target built
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          echo "matrix result: $RESULT"
          if [ "$RESULT" != "success" ]; then
            echo "::error::at least one release target failed to build"
            exit 1
          fi
