name: Release

# Publishes cross-compiled binaries when a version tag is pushed:
#
#   git tag v0.4.0 && git push origin v0.4.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. v0.4.0)'
        required: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
      - run: go test ./...

      # A tag must not publish archives whose licence texts have drifted from
      # the dependencies actually compiled into the binary.
      - name: Verify THIRD-PARTY-NOTICES.md is current
        run: ./scripts/gen-notices.sh --check

  # One job per platform, so the release builds in parallel rather than looping
  # through every target in a single job.
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - darwin/amd64
          - darwin/arm64
          - linux/amd64
          - linux/arm64
          - windows/amd64
          - windows/arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Build ${{ matrix.target }}
        env:
          PLATFORMS: ${{ matrix.target }}
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: ./scripts/build-release.sh

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          # Artifact names cannot contain a slash.
          name: dist-${{ strategy.job-index }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Collect every archive
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # Each build job produced a checksum file for its own archive only, so
      # they were deliberately not uploaded; one is written here over the whole
      # set.
      - name: Checksum the release
        run: |
          cd dist
          shopt -s nullglob
          archives=(*.tar.gz *.zip)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "::error::no archives were produced"
            exit 1
          fi
          shasum -a 256 "${archives[@]}" > SHA256SUMS
          echo "collected ${#archives[@]} archive(s):"
          cat SHA256SUMS

      - name: Build release notes from CHANGELOG.md
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          ./scripts/changelog-section.sh "$VERSION" > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          cat .github/release-footer.md >> notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          gh release create "$VERSION" \
            --title "qvd2parquet $VERSION" \
            --notes-file notes.md \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS
